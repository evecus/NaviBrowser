name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Download Gradle 8.4
        run: |
          GRADLE_VERSION=8.4
          wget -q --tries=3 --retry-connrefused https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          echo "/tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-v2-

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon --refresh-dependencies

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          COMMIT=$(echo ${{ github.sha }} | cut -c1-7)
          DATE=$(date +'%Y%m%d')
          mkdir -p artifacts
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" \
             "artifacts/NaviBrowser-${VERSION}-${DATE}-${COMMIT}.apk"
          echo "===== Build Summary ====="
          ls -lh artifacts/


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: "NaviBrowser test"
          files: artifacts/*.apk
          draft: false
          prerelease: true
